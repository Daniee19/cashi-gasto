name: cashi_gasto
description: "Cashi Gasto - App de gestion de finanzas personales"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  google_nav_bar: ^5.0.6
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.2.0

  # Backend - Supabase
  supabase_flutter: ^2.8.0

  # Utilities
  flutter_dotenv: ^5.1.0
  intl: ^0.20.1
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1+2
  uuid: ^4.4.0
  equatable: ^2.0.5
  pdf: ^3.11.1
  printing: ^5.13.3
  path_provider: ^2.1.4
  google_mlkit_text_recognition: ^0.14.0
  file_picker: ^8.0.0
  pdfx: ^2.6.0
  notification_listener_service: ^0.3.1
  syncfusion_flutter_pdf: ^33.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.4
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/categories/
